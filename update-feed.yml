name: Update PushFooty Feed

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  # Also allow manual trigger from GitHub dashboard
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run feed engine
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: node scripts/engine.js

      - name: Commit and push updated feed.json
        run: |
          git config --global user.name "PushFooty Bot"
          git config --global user.email "bot@pushfooty.net"
          git add public/feed.json
          git diff --staged --quiet || git commit -m "Feed update $(date -u '+%Y-%m-%d %H:%M')"
          git push
